# --- Core Application Settings ---

spring.application.name=EdupointBackend
spring.config.import=optional:classpath:application-secret.properties



# --- Hibernate / JPA Settings ---

spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true



# Keep this false to avoid delaying schema/data init ordering

spring.jpa.defer-datasource-initialization=false



# --- Flyway Settings ---

spring.flyway.enabled=false

spring.flyway.locations=classpath:db/migration

# 1) Retry after past failed migrations

spring.flyway.repair-on-migrate=true

# 2) Allow Flyway after Hibernate touched DB

spring.flyway.baseline-on-migrate=true

spring.flyway.baseline-version=0



# --- Multipart (File Upload) ---

spring.servlet.multipart.max-file-size=500MB

spring.servlet.multipart.max-request-size=500MB



# --- Server Settings ---

server.port=8081



# --- Custom File Storage Properties ---

storage.upload-dir=uploads

file.tempUpload-dir=uploads/temp-video

