# --- Core Application Settings ---

spring.application.name=EdupointBackend
spring.config.import=optional:classpath:application-secret.properties

#jackson configuration
spring.jackson.deserialization.fail-on-unknown-properties=true

# --- Hibernate / JPA Settings ---
spring.jpa.hibernate.ddl-auto=update

# Keep this false to avoid delaying schema/data init ordering
spring.jpa.defer-datasource-initialization=false

# Show SQL statements
spring.jpa.show-sql=true

# Format SQL for better readability
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway Settings ---

spring.flyway.enabled=false

spring.flyway.locations=classpath:db/migration

# 1) Retry after past failed migrations
spring.flyway.repair-on-migrate=true
# 2) Allow Flyway after Hibernate touched DB
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

#spring.flyway.enabled=false
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# --- Multipart (File Upload) ---

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# --- Server Settings ---

server.port=8081

# --- Custom File Storage Properties ---

storage.upload-dir=uploads
file.tempUpload-dir=uploads/temp-video
file.upload-dir=uploads/videos

# --- Debugging ---
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.security=DEBUG


# Sort operations alphabetically by HTTP method and path
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# Show exactly what Spring Security is doing (Auth issues)
#logging.level.org.springframework.security=DEBUG

# Show how Spring MVC is mapping the request (Routing issues)
logging.level.org.springframework.web=DEBUG

# Show the actual SQL if the error is database-related (Hibernate)
logging.level.org.hibernate.SQL=DEBUG


lombok.copyableAnnotations += org.springframework.beans.factory.annotation.Qualifier