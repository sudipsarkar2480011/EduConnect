# --- Core Application Settings ---
spring.application.name=EdupointBackend
server.port=8081

# --- File Storage ---
storage.upload-dir=uploads
file.upload-dir=uploads/videos
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# --- Hibernate Settings (Table Creation) ---
# Hibernate creates tables first
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway Settings (Data Insertion) ---
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

# 1. Clean previous failures so it tries again
spring.flyway.repair-on-migrate=false

# 2. Allow Flyway to run on a database that Hibernate already touched
spring.flyway.baseline-on-migrate=false

# 3. CRITICAL: Remove 'defer-datasource-initialization' or set to false
# This property often pauses Flyway entirely. Let's rely on Bean ordering.
spring.jpa.defer-datasource-initialization=false

# 4. If tables already exist, this prevents Flyway from crashing
spring.flyway.placeholder-replacement=false

# --- Debugging ---
logging.level.org.flywaydb=DEBUG
spring.config.import=optional:classpath:application-secret.properties