spring.application.name=EdupointBackend
server.port=8081

storage.upload-dir=uploads

# 1. Database Connection Setup
#spring.datasource.url=jdbc:mysql://localhost:3306/educonnect?createDatabaseIfNotExist=true&useSSL=false

spring.datasource.url=jdbc:mysql://localhost:3306/educonnect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# 2. Hibernate Settings (Auto-create tables)
# This tells Hibernate to update the schema if entities change
spring.jpa.hibernate.ddl-auto= validate

# 3. SQL Logging (Optional: Helps you see what's happening)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


#FILE_SIZE
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
file.upload-dir=uploads/videos
spring.config.import=optional:classpath:application-secret.properties

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG

