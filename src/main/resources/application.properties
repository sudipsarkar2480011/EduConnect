# --- Core Application Settings ---
spring.application.name=EdupointBackend
server.port=8081

# --- File Storage ---
storage.upload-dir=uploads
file.upload-dir=uploads/videos
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# --- Database Connection ---
# createDatabaseIfNotExist=true ensures the DB exists before Flyway/Hibernate start
spring.datasource.url=jdbc:mysql://localhost:3306/educonnect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Hibernate Settings (Table Creation) ---
# 'update' allows Hibernate to create/modify tables based on your @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway Settings (Data Insertion) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# baseline-on-migrate: Tells Flyway to "claim" the existing tables Hibernate created
spring.flyway.baseline-on-migrate=true

# repair-on-migrate: Automatically fixes the "failed migration" error you saw earlier
spring.flyway.repair-on-migrate=true

# --- The "Hybrid" Glue ---
# This ensures Flyway waits for the Hibernate Schema Management to finish 
# before it tries to run its INSERT scripts.
spring.jpa.defer-datasource-initialization=true

# --- Debugging (Optional) ---
logging.level.org.flywaydb=DEBUG
spring.config.import=optional:classpath:application-secret.properties